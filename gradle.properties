org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 made R8 stop keeping a class's default constructor for "-keep class X" rules. Older libraries still write
# their rules that way: Room 2.2.5 and WorkManager 2.7.1 (both through Glance 1.2.0) then lost the constructors they
# call by name, and every launch of v0.6-v0.7 crashed (#7). This keeps AGP 8's reading of library rules.
android.r8.strictFullModeForKeepRules=false
