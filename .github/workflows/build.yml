name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default (#14): only the jobs that publish (release, report) can write, each saying so itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# A pre-release is published only when the APK builds, passes the unit tests and the APK check, and opens on an
# emulator. Build 9 compiled and passed its tests, then crashed on every launch (#7). A hotfix the owner asks to rush
# may skip the emulator with "[skip launch]" in its commit message; its release notes say so. Then it waits for the
# owner's approval: the release job runs in the "release" environment, which has the owner as its required reviewer (#14).
# Actions from outside GitHub are pinned to a commit (#14): a tag can be moved to other code, a commit can't.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.apk.outputs.version }}
      bytes: ${{ steps.apk.outputs.bytes }}
      cert: ${{ steps.apk.outputs.cert }}
      signing: ${{ steps.key.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # "basic" = the open-source cache on GitHub's own cache storage (the default is a commercial service).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      # The same key for every build, so each APK installs over the previous one. The release build type
      # signs with ~/.android/debug.keystore. Create the secret once: the keystore file in base64, under
      # Settings → Secrets and variables → Actions → SIGNING_KEYSTORE_BASE64.
      - name: Restore the signing key
        id: key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "source=shared key from the secret" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is missing: this APK is signed with a throwaway key and won't install over other builds."
            echo "> ⚠️ No signing secret: this APK is signed with a throwaway key." >> "$GITHUB_STEP_SUMMARY"
            echo "source=THROWAWAY key (secret missing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      # The error lines, in a box on the run's Summary page: the agent reads it, or the owner pastes it.
      - name: Show build errors in the summary
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo "## Build errors (copy everything in the box below)"
            echo '```'
            grep -E '^e: ' build.log | head -n 120 || true
            grep -E -A 12 '^\* What went wrong' build.log | head -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK
        id: apk
        run: |
          version="$(grep -oP 'val versionMajorMinor = "\K[^"]+' app/build.gradle.kts).${{ github.run_number }}"
          apk="stipsplus-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The certificate digest proves which key signed the APK (compare with MAINTAINING.md).
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)"
          cert="unknown"
          if [ -n "$apksigner" ]; then
            cert="$("$apksigner" verify --print-certs "$apk" 2>/dev/null | grep -m1 'SHA-256 digest' | sed 's/.*: //')"
          fi
          {
            echo "version=$version"
            echo "bytes=$(stat -c %s "$apk")"
            echo "cert=${cert:-unknown}"
          } >> "$GITHUB_OUTPUT"

      # R8 can remove a constructor that a library only calls by name: the build and the unit tests pass, and the app
      # crashes on the phone (#7). This reads the APK's code and checks those constructors.
      - name: Check the APK
        id: check
        run: |
          set -o pipefail
          python3 tools/check_apk.py "stipsplus-${{ github.run_number }}.apk" 2>&1 | tee apk-check.txt

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Show test failures in the summary
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          {
            echo "## Test failures (copy everything in the box below)"
            echo '```'
            grep -E -B 2 -A 8 'FAILED$' test.log | head -n 120 || true
            grep -E '^e: ' test.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK for the next jobs
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: stipsplus-${{ github.run_number }}.apk
          retention-days: 7

      - name: Keep the logs for the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            build.log
            test.log
            apk-check.txt
          if-no-files-found: ignore
          retention-days: 7

  launch:
    name: Open on an emulator
    needs: build
    # A hotfix the owner asked to rush can skip it with "[skip launch]" in its commit message; the release still waits
    # for the owner's approval, and its notes say the launch test was skipped.
    if: ${{ !contains(github.event.head_commit.message, '[skip launch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: apk

      # The newest earlier releases: the build is also opened over the data of the newest one that still opens.
      # Newest by build number: the API's own order put build-9 ahead of build-11 (build 12 was tested over build 6).
      - name: Get earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mv "stipsplus-$RUN_NUMBER.apk" app.apk
          old=""
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            [.[] | .tag_name | select(test("^build-[0-9]+$")) | ltrimstr("build-") | tonumber
              | select(. != (env.RUN_NUMBER | tonumber))]
            | sort | reverse | .[:4] | .[] | "build-\(.)"')
          echo "Earlier releases, newest first: $tags"
          for tag in $tags; do
            if gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'stipsplus-*.apk' -O "$tag.apk"; then
              old="$old $tag.apk"
            fi
          done
          echo "OLD_APKS=${old# }" >> "$GITHUB_ENV"
          ls -l ./*.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager sometimes gets a broken download ("Error on ZipFile unknown archive", an intermittent problem also
      # reported as android-emulator-runner#496; build 10 hit it and no emulator started). Installing everything first,
      # with retries, leaves the emulator runner nothing to download.
      - name: Install the emulator and the Android 15 image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3 4; do
            if "$sdkmanager" --install platform-tools "platforms;android-35" emulator "system-images;android-35;google_apis;x86_64" > sdk-install.log 2>&1; then
              echo "Installed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed:"
            tail -n 5 sdk-install.log
            sleep 20
          done
          echo "::warning::Couldn't install the emulator ahead; the emulator runner will try by itself."

      # API 35 (Android 15) boots in about 2 minutes here; the Android 17 image didn't boot within 10 (launch-test.yml).
      - name: Open the app
        id: launch1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 (2.38.0)
        env:
          SHORTCUTS: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/launch_test.sh

      # A second try only when the emulator never started (the script writes its summary once it's running). An app
      # that crashes is never retried.
      - name: Open the app (second try, the emulator didn't start)
        id: launch2
        if: steps.launch1.outcome == 'failure' && hashFiles('launch-test/summary.md') == ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 (2.38.0)
        env:
          SHORTCUTS: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/launch_test.sh

      - name: Fail unless the app opened
        if: steps.launch1.outcome == 'failure' && steps.launch2.outcome != 'success'
        run: |
          echo "::error::The launch test failed; its summary (above, and in the launch-test artifact) says why."
          exit 1

      # Only when it failed (#14): the screenshots show Stips' live posts, and a public repository's artifacts are
      # public.
      - name: Keep the screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launch-test
          path: launch-test/
          retention-days: 5

      - name: Keep the summary for the release notes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-summary
          path: launch-test/summary.md
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish the pre-release
    needs: [build, launch]
    # After the launch test passed, or when a hotfix skipped it ("[skip launch]"); never when it failed.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.launch.result == 'success' || needs.launch.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits for the owner's approval (Settings → Environments → release → Required reviewers), #14.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: apk

      - uses: actions/download-artifact@v8
        if: needs.launch.result == 'success'
        with:
          name: launch-summary

      # The notes are the round's summary (RELEASE-NOTES.md) and what was checked, so the owner reads both on the phone.
      - name: Write the release notes
        env:
          APK_BYTES: ${{ needs.build.outputs.bytes }}
          APK_CERT: ${{ needs.build.outputs.cert }}
        run: |
          {
            cat RELEASE-NOTES.md
            echo
            echo "---"
            echo
            if [ -f summary.md ]; then
              echo "**Checked before publishing:** the unit tests, the APK check (constructors that libraries call by name, #7) and this launch test."
              echo
              cat summary.md
            else
              echo "**Checked before publishing:** the unit tests and the APK check (constructors that libraries call by name, #7). The launch test on an emulator was skipped for this hotfix ([skip launch])."
            fi
            echo
            echo "<sub>Commit ${GITHUB_SHA:0:7} · $(( ${APK_BYTES:-0} / 1024 )) KB · signing certificate SHA-256 ${APK_CERT:0:16}…</sub>"
          } > release-notes.md

      - name: Publish a pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3 (3.0.4)
        with:
          tag_name: build-${{ github.run_number }}
          name: Stips+ ${{ needs.build.outputs.version }}
          prerelease: true
          body_path: release-notes.md
          files: stipsplus-${{ github.run_number }}.apk

  # The outcome on the ci-status branch, which git can fetch. It never contains secrets: only error lines. It doesn't
  # wait for the release, which waits for the owner's approval: the release shows on the Releases page.
  report:
    name: Report to the ci-status branch
    needs: [build, launch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: build-logs

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: launch-summary

      - name: Write and push status.md
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LAUNCH_RESULT: ${{ needs.launch.result }}
          SIGNING_SOURCE: ${{ needs.build.outputs.signing }}
          APK_CERT: ${{ needs.build.outputs.cert }}
          APK_BYTES: ${{ needs.build.outputs.bytes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/status.md"
          {
            echo "run: ${{ github.run_number }}"
            echo "sha: ${{ github.sha }}"
            echo "build-and-tests: ${BUILD_RESULT:-skipped}"
            echo "launch-test: ${LAUNCH_RESULT:-skipped}"
            # The release waits for the owner's approval; this report doesn't wait for it. A hotfix may skip the launch test.
            if [ "$BUILD_RESULT" = "success" ] && { [ "$LAUNCH_RESULT" = "success" ] || [ "$LAUNCH_RESULT" = "skipped" ]; }; then release="waiting for approval"; else release="skipped"; fi
            echo "release: $release"
            echo "signing: ${SIGNING_SOURCE:-unknown}"
            echo "cert-sha256: ${APK_CERT:-unknown}"
            echo "apk-bytes: ${APK_BYTES:-unknown}"
            echo
            echo "## Build errors"
            [ -f build.log ] && grep -E '^e: ' build.log | head -n 150 || true
            [ -f build.log ] && grep -E -A 15 '^\* What went wrong' build.log | head -n 80 || true
            echo
            echo "## APK check"
            [ -f apk-check.txt ] && cat apk-check.txt || true
            echo
            echo "## Test failures"
            [ -f test.log ] && grep -E -B 2 -A 12 'FAILED$' test.log | head -n 150 || true
            [ -f test.log ] && grep -E '^e: ' test.log | head -n 60 || true
            echo
            echo "## Launch test"
            [ -f summary.md ] && cat summary.md || true
            if [ "$BUILD_RESULT" = "success" ] && [ "$LAUNCH_RESULT" = "skipped" ]; then echo "Skipped: [skip launch] in the commit message."; fi
          } > "$report"
          dir="$RUNNER_TEMP/ci-status"
          rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
          git init -q -b ci-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$report" status.md
          git add status.md
          git commit -q -m "Run ${{ github.run_number }}: build ${BUILD_RESULT:-skipped}, launch ${LAUNCH_RESULT:-skipped}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-status
